[package]
authors = { workspace = true }
categories = { workspace = true }
description = "Internal WebTransport link for zenoh."
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
name = "zenoh-link-webtransport"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[dependencies]
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
wtransport = { workspace = true }
zenoh-core = { workspace = true }
zenoh-link-commons = { workspace = true, features = ["quic", "tls"] }
zenoh-keyexpr = { workspace = true }
zenoh-protocol = { workspace = true }
zenoh-result = { workspace = true }
zenoh-runtime = { workspace = true }
zenoh-util = { workspace = true }

[dev-dependencies]
flume = { workspace = true }
rcgen = { workspace = true }
wtransport = { workspace = true, features = ["self-signed"] }
